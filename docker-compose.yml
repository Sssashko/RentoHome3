version: "3.8"

services:
  # 1) MySQL in Docker
  mysql:
    image: mysql:8.0
    container_name: rentohome-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: prizma12
      MYSQL_DATABASE: rentohome
    ports:
      # Map host port 3307 → container port 3306
      - "3307:3306"
    volumes:
      # Persist MySQL data on the host so data survives restarts
      - ./clean_dump.sql:/docker-entrypoint-initdb.d/dump.sql
      - db_data:/var/lib/mysql

  # 2) Backend (Express + TypeScript)s
  server:
    container_name: rentohome-server
    build:
      # Look for the Dockerfile inside ./server folder
      context: ./server
      dockerfile: Dockerfile
    # Use .env.docker inside the server folder (configured to connect to “mysql” service)
    env_file:
      - ./server/.env.docker
    depends_on:
      # Ensure MySQL service is running before starting the backend
      - mysql
    ports:
      # Expose container port 4000 → host port 4000
      - "4000:4000"
    restart: unless-stopped

  # 3) Frontend (React + Vite)
  client:
    container_name: rentohome-client
    build:
      # Look for the Dockerfile inside ./client folder
      context: ./client
      dockerfile: Dockerfile
    # Load environment variables for the frontend (e.g. VITE_SERVER_URL)
    env_file:
      - ./client/.env
    depends_on:
      # Wait for backend service to be ready first
      - server
    ports:
      # Expose container port 3000 → host port 3000
      - "3001:3000"
    restart: unless-stopped

volumes:
  # Named volume for persisting MySQL data
  db_data:
